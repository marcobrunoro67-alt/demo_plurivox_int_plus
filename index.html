const D = {
it: {
 name: "Italiano",
 ui: {title:"Plurivox International Plus · Demo", sub:"Guarda come funziona un dibattito tra IA, con un esempio già pronto.", banner:"<b>Demo dimostrativa.</b> I testi qui sotto sono esempi scritti a mano per mostrare come si presenta un dibattito: nessuna IA è stata interrogata e non sono risposte reali di Claude, ChatGPT o Mistral. Nel programma vero le risposte vengono dalle IA che scegli con le tue chiavi.", ex:"Esempio", q:"Il quesito", who:"Chi partecipa", added:"IA aggiunta", mod:"Moderatore", turns:"Turni di dibattito", files:"File di riferimento", nofiles:"Nessun file in questo esempio", start:"Avvia il dibattito", replay:"Rivedi dall'inizio", all:"Mostra tutto subito", turn:"Turno", thinking:"sta scrivendo…", rep:"Relazione finale", repby:"scritta dal moderatore", prompt:"Prompt pronto per un compito specifico", promptn:"Si può incollare in «Compito singolo» insieme alla relazione.", warn:"Prima di usare dati reali: non caricare dati personali o sensibili, verifica sempre il risultato e rispetta le regole del tuo Paese e della tua organizzazione. Il programma mostra le avvertenze del Paese in cui lo apri.", foot:"Demo di Plurivox International Plus · esempi simulati, non consulenza"},
 q: "Siamo un piccolo negozio online di articoli per la casa. Possiamo usare l'IA per scrivere le prime bozze delle risposte alle email dei clienti? Abbiamo dubbi su qualità, tempi e dati dei clienti.",
 turns: [[
  {ai:"Claude", t:"Sì, ma solo come bozza: una persona la legge e la invia. Le email di assistenza sono ripetitive (spedizioni, resi, garanzia) e qui l'IA fa risparmiare tempo. Il rischio principale è promettere cose sbagliate, per esempio rimborsi o tempi di consegna. Proporrei modelli di risposta approvati e l'IA che li adatta al caso."},
  {ai:"ChatGPT", t:"Concordo sul controllo umano. Aggiungo il tema dati: nome, indirizzo e numero d'ordine sono dati personali. Prima di inviarli a un servizio esterno conviene toglierli o sostituirli con segnaposto e controllare le condizioni del fornitore. Partirei dalle email che non contengono dati personali, per esempio le domande sui prodotti."},
  {ai:"Mistral", t:"Misurerei il vantaggio prima di decidere. Per due settimane contate quante email arrivano, di che tipo e quanto tempo richiede ciascuna. Se le richieste ripetitive sono poche, il beneficio è piccolo e non vale la complessità. Serve anche un criterio di qualità: quante bozze si inviano senza modifiche."}],[
  {ai:"Claude", t:"Il punto di ChatGPT sui dati cambia il mio piano: partiamo solo dalle domande sui prodotti, senza dati dei clienti. Sul punto di Mistral mi correggo: prima si misura. Aggiungo una regola: l'IA non scrive mai su rimborsi, reclami o questioni legali, che restano a una persona."},
  {ai:"ChatGPT", t:"Sono d'accordo con le due regole. Propongo un test di tre settimane: una persona usa le bozze e annota il tempo risparmiato e le correzioni necessarie. Alla fine decidete con i numeri. Va anche valutato se informare i clienti dell'uso dell'IA nell'assistenza, dove richiesto."},
  {ai:"Mistral", t:"Sì al test, ma fissiamo le soglie prima di iniziare: per esempio almeno il 60% di bozze usabili con poche modifiche e nessun errore su prezzi o tempi. Se non le raggiungete, si sospende. Va deciso anche chi controlla e chi risponde se parte una risposta sbagliata."}]],
 rep: {title:"Relazione finale: IA per le email dei clienti", sum:"Conviene provarla come supporto, non come sostituto: l'IA prepara la bozza, una persona la controlla e la invia. Si parte con un test di tre settimane e si decide sui numeri.", head:["Aspetto","Posizione condivisa"], rows:[["Controllo umano","Ogni risposta è letta e inviata da una persona"],["Dati dei clienti","Nessun dato personale nel test; solo domande sui prodotti"],["Limiti","L'IA non tratta rimborsi, reclami o questioni legali"],["Misura","Tempo risparmiato e percentuale di bozze usabili (soglia da fissare, per esempio 60%)"]], dis:"<b>Punti aperti.</b> ChatGPT chiede di valutare l'informativa ai clienti; Mistral di fissare le soglie prima dell'avvio. Responsabile del controllo: [DA VERIFICARE: chi nel negozio]."},
 prompt: "Sei un assistente per un negozio online di articoli per la casa. Scrivi una bozza di risposta cortese e chiara all'email del cliente che trovi sotto, usando solo le informazioni nel documento allegato. Non promettere rimborsi o tempi di consegna che non sono indicati. Se manca un'informazione scrivi [DA VERIFICARE]. Restituisci solo il testo della bozza, in non più di 120 parole."
},
en: {
 name: "English",
 ui: {title:"Plurivox International Plus · Demo", sub:"See how a debate between AIs works, with a ready-made example.", banner:"<b>Demonstration only.</b> The texts below are hand-written examples showing what a debate looks like: no AI was queried and they are not real answers from Claude, ChatGPT or Mistral. In the real program the answers come from the AIs you choose, using your own keys.", ex:"Example", q:"The question", who:"Who takes part", added:"added AI", mod:"Moderator", turns:"Debate turns", files:"Reference files", nofiles:"No files in this example", start:"Start the debate", replay:"Watch again", all:"Show everything now", turn:"Turn", thinking:"is writing…", rep:"Final report", repby:"written by the moderator", prompt:"Ready-made prompt for a specific task", promptn:"It can be pasted into «Single task» together with the report.", warn:"Before using real data: do not upload personal or sensitive data, always check the result, and follow the rules of your country and organisation. The program shows the notices for the country where you open it.", foot:"Plurivox International Plus demo · simulated examples, not advice"},
 q: "A 12-person accounting firm wants to use AI to summarise long client documents before meetings. We worry about accuracy, confidentiality and whether clients should be told.",
 turns: [[
  {ai:"Claude", t:"It can save real time, but treat the summary as a reading aid, never as the source. A partner should still open the original for any figure or date that matters. The risk is a fluent summary that drops a condition or changes a number without anyone noticing, so every summary should point back to the pages it came from."},
  {ai:"ChatGPT", t:"Confidentiality comes first. Client documents often hold tax and bank details, and your professional duties apply whatever tool you use. Check what the provider does with submitted text, whether it is kept or used for training, and whether the contract allows it. Start with documents that are already public or fully anonymised."},
  {ai:"Mistral", t:"Be specific about the job. 'Summarise documents' is too vague to test. Pick one type, say lease agreements, and define what a good summary contains: parties, dates, amounts, termination terms. Then compare the AI summary with one written by a person on ten real examples before deciding anything."}],[
  {ai:"Claude", t:"Mistral's point improves my plan: one document type, ten examples, a checklist of fields the summary must contain. I also accept ChatGPT's priority on confidentiality, so the pilot uses anonymised copies. I would add a rule that any field marked uncertain goes back to a person."},
  {ai:"ChatGPT", t:"Agreed. On telling clients, the answer depends on your engagement letters, your professional body and local rules, so I would not guess here: ask your regulator or adviser. Whatever they say, update the engagement letter so clients know how their documents are handled."},
  {ai:"Mistral", t:"Good. Define the pass mark before the pilot: for instance, no wrong figure or date in ten summaries, and at least a quarter of review time saved. If a summary fails the check, record why. Also name one person who owns the pilot and reports back to the partners."}]],
 rep: {title:"Final report: AI summaries of client documents", sum:"A limited pilot is reasonable if it uses anonymised copies, one document type and a human check. Confidentiality and client information must be settled before real documents are used.", head:["Topic","Shared position"], rows:[["Role of the AI","Reading aid; the original stays the source"],["Confidentiality","Anonymised copies in the pilot; check the provider's terms first"],["Test","One document type, ten examples, compared with a human summary"],["Pass mark","No wrong figure or date; about a quarter of review time saved (to be confirmed)"]], dis:"<b>Open points.</b> Whether and how to inform clients depends on your professional rules: [TO BE VERIFIED: with your regulator or adviser]."},
 prompt: "You are an assistant for an accounting firm. Summarise the attached lease agreement for a partner who has five minutes. Use only the document. List: parties, start and end dates, rent and other amounts, notice and termination terms, and anything unusual. After each item give the page or clause. If something is unclear write [TO BE VERIFIED]. Maximum 250 words."
},
fr: {
 name: "Français",
 ui: {title:"Plurivox International Plus · Démo", sub:"Découvrez le fonctionnement d'un débat entre IA, avec un exemple prêt à l'emploi.", banner:"<b>Démonstration uniquement.</b> Les textes ci-dessous sont des exemples écrits à la main pour montrer à quoi ressemble un débat : aucune IA n'a été interrogée et ce ne sont pas de vraies réponses de Claude, ChatGPT ou Mistral. Dans le vrai programme, les réponses viennent des IA que vous choisissez, avec vos propres clés.", ex:"Exemple", q:"La question", who:"Qui participe", added:"IA ajoutée", mod:"Modérateur", turns:"Tours de débat", files:"Fichiers de référence", nofiles:"Aucun fichier dans cet exemple", start:"Lancer le débat", replay:"Revoir depuis le début", all:"Tout afficher maintenant", turn:"Tour", thinking:"est en train d'écrire…", rep:"Rapport final", repby:"rédigé par le modérateur", prompt:"Prompt prêt pour une tâche précise", promptn:"Il peut être collé dans « Tâche unique » avec le rapport.", warn:"Avant d'utiliser des données réelles : ne chargez pas de données personnelles ou sensibles, vérifiez toujours le résultat et respectez les règles de votre pays et de votre organisation. Le programme affiche les avertissements du pays où vous l'ouvrez.", foot:"Démo de Plurivox International Plus · exemples simulés, pas un conseil"},
 q: "Un petit hôtel de 20 chambres veut répondre aux avis en ligne avec l'aide de l'IA. Nous craignons des réponses froides ou maladroites, et nous ne savons pas quelles informations sur les clients peuvent apparaître.",
 turns: [[
  {ai:"Claude", t:"L'IA peut préparer un brouillon, mais un avis est une conversation publique : le ton compte plus que la vitesse. Je proposerais trois gabarits (éloge, critique précise, critique vague) que l'IA adapte, puis une personne relit avant publication. Une réponse trop générique se voit tout de suite et peut nuire à l'image de l'hôtel."},
  {ai:"ChatGPT", t:"Attention aux informations sur les clients. Dans une réponse publique, ne mentionnez jamais la date de séjour exacte, le numéro de chambre ni les détails de la réservation, même si le client les cite lui-même. Donnez à l'IA uniquement le texte de l'avis, sans le dossier de réservation, et demandez-lui de rester général."},
  {ai:"Mistral", t:"Je commencerais par trier les avis. Les critiques sur des faits vérifiables (propreté, bruit, petit-déjeuner) méritent une réponse personnalisée et une action interne. Les avis très courts ou purement positifs peuvent recevoir une réponse plus simple. Il faut aussi décider qui valide et sous quel délai, par exemple 48 heures."}],[
  {ai:"Claude", t:"Je retiens la règle de ChatGPT : l'IA ne reçoit que le texte de l'avis. Et le tri de Mistral me convainc : les critiques factuelles ne sont jamais traitées avec un gabarit seul. J'ajoute qu'on ne cite jamais d'excuses précises sans que la direction ait vérifié ce qui s'est passé."},
  {ai:"ChatGPT", t:"D'accord. Pour tester, prenez vingt anciens avis et comparez les brouillons de l'IA avec vos réponses réelles. Notez ce qu'il faut corriger à chaque fois : ton, informations erronées, promesses. Sur les avis qui touchent la santé, l'hygiène ou la sécurité, la direction répond toujours elle-même."},
  {ai:"Mistral", t:"Oui à ce test. Je fixerais un critère simple : au moins quatorze brouillons sur vingt publiables après deux retouches au plus, et aucune information sur un client. Et un responsable unique du ton de l'hôtel, pour que les réponses restent cohérentes d'un mois à l'autre."}]],
 rep: {title:"Rapport final : l'IA pour répondre aux avis en ligne", sum:"L'IA peut aider à rédiger des brouillons, à condition que l'IA ne reçoive que le texte de l'avis et qu'une personne valide chaque réponse avant publication. On teste d'abord sur d'anciens avis.", head:["Point","Position commune"], rows:[["Rôle de l'IA","Brouillon ; la validation reste humaine"],["Données clients","Seul le texte de l'avis est transmis ; rien sur le séjour ni la réservation"],["Tri","Critiques factuelles : réponse personnalisée ; santé, hygiène, sécurité : la direction répond"],["Test","Vingt anciens avis ; au moins quatorze brouillons publiables (seuil à confirmer)"]], dis:"<b>Points ouverts.</b> Délai de validation et responsable du ton : [À VÉRIFIER : qui à l'hôtel]."},
 prompt: "Vous aidez un petit hôtel à répondre à un avis en ligne. Rédigez un brouillon de réponse courte (80 mots maximum), chaleureuse et professionnelle, à partir du seul texte de l'avis ci-dessous. Ne mentionnez ni dates de séjour, ni chambre, ni détails de réservation. N'inventez aucune excuse ni promesse précise : si un fait doit être vérifié, écrivez [À VÉRIFIER]. Rendez uniquement le texte de la réponse."
},
de: {
 name: "Deutsch",
 ui: {title:"Plurivox International Plus · Demo", sub:"So funktioniert eine Debatte zwischen KI, mit einem fertigen Beispiel.", banner:"<b>Nur zur Demonstration.</b> Die Texte unten sind von Hand geschriebene Beispiele, die zeigen, wie eine Debatte aussieht: Es wurde keine KI befragt, und es sind keine echten Antworten von Claude, ChatGPT oder Mistral. Im echten Programm kommen die Antworten von den KI, die Sie mit Ihren eigenen Schlüsseln wählen.", ex:"Beispiel", q:"Die Frage", who:"Wer teilnimmt", added:"hinzugefügte KI", mod:"Moderator", turns:"Debattenrunden", files:"Referenzdateien", nofiles:"Keine Dateien in diesem Beispiel", start:"Debatte starten", replay:"Von vorn ansehen", all:"Alles sofort anzeigen", turn:"Runde", thinking:"schreibt gerade…", rep:"Abschlussbericht", repby:"vom Moderator geschrieben", prompt:"Fertiger Prompt für eine bestimmte Aufgabe", promptn:"Er lässt sich zusammen mit dem Bericht in «Einzelaufgabe» einfügen.", warn:"Bevor Sie echte Daten verwenden: keine personenbezogenen oder sensiblen Daten hochladen, das Ergebnis immer prüfen und die Regeln Ihres Landes und Ihrer Organisation beachten. Das Programm zeigt die Hinweise für das Land, in dem Sie es öffnen.", foot:"Plurivox-International-Plus-Demo · simulierte Beispiele, keine Beratung"},
 q: "Ein Handwerksbetrieb mit acht Mitarbeitern möchte Angebote mit KI-Entwürfen schreiben. Wir fürchten falsche Preise und Zusagen, die wir nicht halten können. Außerdem ist unklar, was wir über Kunden eingeben dürfen.",
 turns: [[
  {ai:"Claude", t:"Für den Textteil eines Angebots ist die KI nützlich: Leistungsbeschreibung, Ablauf, freundliche Formulierungen. Die Zahlen dürfen aber nicht von ihr kommen. Preise, Mengen und Termine bleiben in Ihrer Kalkulation, die KI bekommt nur Platzhalter. Ein Mensch prüft jedes Angebot, bevor es das Haus verlässt."},
  {ai:"ChatGPT", t:"Ich stimme zu und ergänze die Kundendaten. Name und Adresse des Kunden brauchen Sie für den Entwurf nicht; schreiben Sie «Kunde» und fügen Sie die Daten erst im fertigen Dokument ein. Beschreiben Sie die Baustelle ohne Anschrift. So geht kein Personenbezug an einen externen Dienst."},
  {ai:"Mistral", t:"Ich würde zuerst Ihre letzten zehn Angebote ansehen. Welche Teile wiederholen sich fast wörtlich? Dort lohnt sich die KI. Bei Sonderfällen, etwa Altbau oder Gewährleistungsfragen, ist ein Standardtext riskant. Legen Sie fest, welche Angebotstypen mit KI-Entwurf erlaubt sind und welche nicht."}],[
  {ai:"Claude", t:"Mistrals Hinweis ändert meinen Vorschlag: erst die Standardfälle, Sonderfälle bleiben ohne KI. Ich übernehme außerdem ChatGPTs Regel, keine Kundendaten einzugeben. Zusätzlich: Die KI darf keine Fristen oder Gewährleistungszusagen formulieren, die nicht in Ihrer Vorlage stehen."},
  {ai:"ChatGPT", t:"Einverstanden. Für den Test nehmen Sie fünf Standardangebote und vergleichen den KI-Entwurf mit dem, den Sie selbst geschrieben haben. Notieren Sie, wie viel Zeit Sie sparen und was korrigiert werden musste. Ob Sie Kunden den KI-Einsatz mitteilen müssen, klären Sie mit Ihrer Kammer oder Ihrem Berater."},
  {ai:"Mistral", t:"Gut. Ich würde ein klares Ziel setzen: mindestens eine Stunde Zeitersparnis pro Angebot und kein falscher Betrag in fünf Entwürfen. Wird das verfehlt, stoppen Sie. Bestimmen Sie eine Person, die den Entwurf freigibt und für Fehler geradesteht."}]],
 rep: {title:"Abschlussbericht: KI-Entwürfe für Angebote", sum:"KI kann Textteile von Standardangeboten vorbereiten. Zahlen, Fristen und Zusagen kommen aus Ihrer Kalkulation, Kundendaten werden nicht eingegeben, und jedes Angebot wird von einer Person freigegeben.", head:["Thema","Gemeinsame Position"], rows:[["Aufgabe der KI","Nur Textteile von Standardangeboten"],["Zahlen und Zusagen","Nur aus Ihrer Kalkulation und Vorlage"],["Kundendaten","Nicht eingeben; Platzhalter «Kunde»"],["Test","Fünf Standardangebote; Ziel: Zeitersparnis, kein falscher Betrag (Wert zu bestätigen)"]], dis:"<b>Offene Punkte.</b> Ob der KI-Einsatz gegenüber Kunden mitzuteilen ist: [ZU PRÜFEN: bei Kammer oder Berater]."},
 prompt: "Sie unterstützen einen Handwerksbetrieb. Schreiben Sie den Textteil eines Angebots (Leistungsbeschreibung und Ablauf, höchstens 200 Wörter) anhand der beigefügten Vorlage und der Stichpunkte. Verwenden Sie für Name und Adresse nur den Platzhalter «Kunde». Nennen Sie keine Preise, Fristen oder Gewährleistungszusagen, die nicht in der Vorlage stehen. Was unklar ist, markieren Sie mit [ZU PRÜFEN]. Geben Sie nur den Text aus."
},
es: {
 name: "Español",
 ui: {title:"Plurivox International Plus · Demo", sub:"Mira cómo funciona un debate entre IA, con un ejemplo listo.", banner:"<b>Solo demostración.</b> Los textos de abajo son ejemplos escritos a mano para mostrar cómo se ve un debate: no se ha consultado ninguna IA y no son respuestas reales de Claude, ChatGPT o Mistral. En el programa real las respuestas vienen de las IA que elijas, con tus propias claves.", ex:"Ejemplo", q:"La cuestión", who:"Quién participa", added:"IA añadida", mod:"Moderador", turns:"Turnos de debate", files:"Archivos de referencia", nofiles:"Sin archivos en este ejemplo", start:"Iniciar el debate", replay:"Ver de nuevo desde el principio", all:"Mostrar todo ahora", turn:"Turno", thinking:"está escribiendo…", rep:"Informe final", repby:"redactado por el moderador", prompt:"Prompt listo para una tarea concreta", promptn:"Se puede pegar en «Tarea única» junto con el informe.", warn:"Antes de usar datos reales: no subas datos personales o sensibles, comprueba siempre el resultado y respeta las normas de tu país y de tu organización. El programa muestra los avisos del país donde lo abres.", foot:"Demo de Plurivox International Plus · ejemplos simulados, no es asesoramiento"},
 q: "Una asociación de vecinos quiere usar IA para redactar las actas de sus reuniones y los comunicados al barrio. Tenemos dudas sobre si el acta será fiel a lo que se dijo y sobre los nombres de los vecinos.",
